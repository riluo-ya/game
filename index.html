<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="images/logo.png" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

    <title>小游戏平台</title>
    <meta name="keywords" content="小游戏平台,小游戏" />
    <meta name="description" content="小游戏平台，一套多个小游戏网站合集，采用响应式布局设计。" />
    
    <!-- 视口设置，禁止缩放 -->
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport' />
    <meta name="viewport" content="width=device-width" />

    <!-- 引入字体图标 -->
    <link rel="stylesheet" href="css/font-awesome-4.7.0/css/font-awesome.min.css">

    <!-- 核心样式 -->
    <style>
        :root {
            --primary: #6366f1;       /* 动作游戏风格主色 */
            --primary-dark: #4f46e5;
            --primary-light: #8b5cf6;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-500: #64748b;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background-color: var(--gray-50);
            height: 100vh;
            overflow: hidden; /* 防止主页面滚动 */
        }

        /* 布局容器 */
        .wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 260px;
            background-color: var(--white);
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .logo {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--gray-100);
            background: var(--white);
        }

        .logo a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--primary);
            font-size: 20px;
            font-weight: 700;
        }

        .logo img {
            margin-right: 10px;
        }

        .sidebar-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .nav {
            list-style: none;
        }

        .nav li {
            margin-bottom: 5px;
        }

        .nav li a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: var(--gray-500);
            text-decoration: none;
            border-radius: var(--radius-md);
            transition: var(--transition);
            font-weight: 500;
        }

        .nav li a:hover {
            background-color: var(--gray-100);
            color: var(--primary);
        }

        .nav li.active a {
            background-color: var(--primary);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .nav li i {
            margin-right: 12px;
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--gray-500);
            border-top: 1px solid var(--gray-100);
        }

        /* 主面板样式 */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 顶部导航 */
        .navbar {
            background-color: var(--white);
            padding: 15px 30px;
            box-shadow: var(--shadow-sm);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px; /* 固定高度 */
        }

        .navbar-header .navbar-toggle {
            display: none;
            background: transparent;
            border: none;
            font-size: 24px;
            color: var(--gray-700);
            cursor: pointer;
        }

        /* 内容区域 (iframe容器) */
        .content {
            flex: 1;
            position: relative;
            background-color: var(--gray-50);
            overflow: hidden;
        }

        /* iframe 样式 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .wrapper {
                flex-direction: column;
                height: 100vh;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 100%; /* 允许侧边栏内部滚动 */
                border-right: none;
                border-bottom: 1px solid var(--gray-200);
                box-shadow: none;
            }

            .sidebar-wrapper {
                max-height: 40vh; /* 移动端限制菜单高度 */
                overflow-y: auto;
            }

            .nav {
                display: flex;
                flex-wrap: wrap;
            }

            .nav li {
                width: 50%; /* 移动端菜单两列显示 */
            }

            .nav li a {
                justify-content: center;
            }
            
            .navbar {
                padding: 10px 20px;
                height: 60px;
            }

            .navbar-header .navbar-toggle {
                display: block;
            }
        }

        @media (max-width: 480px) {
            .nav li {
                width: 100%; /* 小屏幕单列 */
            }
        }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--gray-100);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="logo">
                <a href="/" target="right">
                    <img src="images/logo.png" width="30" height="30" alt="Logo"/>
                    小游戏平台
                </a>
            </div>

            <div class="sidebar-wrapper">
                <ul class="nav">
                    <li class="active">
                        <a href="link/0.html" target="right" onclick="setActive(this)">
                            <i class="fa fa-twitch"></i>
                            <p>全部游戏</p>
                        </a>
                    </li>
                    <li>
                        <a href="link/1.html" target="right" onclick="setActive(this)">
                            <i class="fa fa-mortar-board"></i>
                            <p>益智游戏</p>
                        </a>
                    </li>
                    <li>
                        <a href="link/2.html" target="right" onclick="setActive(this)">
                            <i class="fa fa-reddit-alien"></i>
                            <p>动作游戏</p>
                        </a>
                    </li>
                    <li>
                        <a href="link/3.html" target="right" onclick="setActive(this)">
                            <i class="fa fa-rocket"></i>
                            <p>射击游戏</p>
                        </a>
                    </li>
                    <li>
                        <a href="link/4.html" target="right" onclick="setActive(this)">
                            <i class="fa fa-houzz"></i>
                            <p>消除游戏</p>
                        </a>
                    </li>    
                    <li>
                        <a href="link/5.html" target="right" onclick="setActive(this)">
                            <i class="fa fa-modx"></i>
                            <p>休闲游戏</p>
                        </a>
                    </li> 
                    <li>
                        <a href="link/6.html" target="right" onclick="setActive(this)">
                            <i class="fa fa-delicious"></i>
                            <p>棋牌游戏</p>
                        </a>
                    </li> 
                </ul>
            </div>
            <div class="sidebar-footer">
                <hr style="margin: 10px 0; border: 0; border-top: 1px solid var(--gray-200);">
                <a href="/" style="color: var(--gray-500); text-decoration: none;">在线小游戏</a> 版权所有
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-panel">
            <nav class="navbar">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle">
                        <i class="fa fa-bars"></i>
                    </button>
                </div>
                <!-- 顶部右侧可以放搜索或其他功能 -->
            </nav>

            <div class="content">
                <!-- 保留原有的 iframe 逻辑，加载 link/ 目录下的页面 -->
                <iframe src="link/1.html" name="right" scrolling="auto"></iframe>
            </div>
        </div>
    </div>

    <!-- 简单的脚本处理菜单激活状态 -->
    <script>
        function setActive(element) {
            // 移除所有 active 类
            var links = document.querySelectorAll('.nav li');
            links.forEach(function(link) {
                link.classList.remove('active');
            });
            // 给当前点击的父级 li 添加 active 类
            element.parentElement.classList.add('active');
        }

        // 移动端菜单折叠逻辑（可选）
        document.querySelector('.navbar-toggle').addEventListener('click', function() {
            var sidebar = document.querySelector('.sidebar-wrapper');
            if (sidebar.style.display === 'none') {
                sidebar.style.display = 'block';
            } else {
                sidebar.style.display = 'none';
            }
        });
    </script>
</body>
</html>
