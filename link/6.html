<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>棋牌游戏 - 小游戏平台</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #8b5cf6;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-500: #64748b;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background-color: var(--gray-50);
            padding: 20px;
            line-height: 1.5;
        }
        .game-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .game-card {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            display: block;
            transition: var(--transition);
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 6张卡片逐帧渐入，视觉更流畅 */
        .game-card:nth-child(1) { animation-delay: 0.02s; }
        .game-card:nth-child(2) { animation-delay: 0.06s; }
        .game-card:nth-child(3) { animation-delay: 0.1s; }
        .game-card:nth-child(4) { animation-delay: 0.14s; }
        .game-card:nth-child(5) { animation-delay: 0.18s; }
        .game-card:nth-child(6) { animation-delay: 0.22s; }
        .game-cover {
            width: 100%;
            height: 130px;
            overflow: hidden;
            background-color: var(--gray-100);
        }
        .game-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }
        .game-info {
            padding: 14px;
        }
        .game-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .game-desc {
            font-size: 13px;
            color: var(--gray-500);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        /* 统一悬浮交互效果 */
        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }
        .game-card:hover .game-cover img {
            transform: scale(1.08);
        }
        .game-card:hover .game-name {
            color: var(--primary);
        }
        .game-card.hidden {
            display: none;
        }
        .empty-tip {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-500);
            font-size: 15px;
            display: none;
        }
        .empty-tip.show {
            display: block;
        }
        .empty-tip i {
            font-size: 40px;
            color: var(--gray-300);
            margin-bottom: 12px;
            display: block;
        }
        /* 多设备自适应多列，无单列 */
        @media (max-width: 992px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 16px;
            }
            .game-cover {
                height: 110px;
            }
            .game-info {
                padding: 12px;
            }
        }
        @media (max-width: 576px) {
            body {
                padding: 12px;
            }
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
                gap: 12px;
            }
            .game-cover {
                height: 100px;
            }
            .game-info {
                padding: 10px;
            }
            .game-name {
                font-size: 14px;
            }
            .game-desc {
                font-size: 12px;
            }
        }
        /* 全局美化滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
    </style>
    <link rel="stylesheet" href="../css/font-awesome-4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="game-container">
        <div class="game-grid" id="gameGrid">
            <!-- 原有6个棋牌类游戏，保留所有信息，适配新样式 -->
            <a href="../yxmb/1/index.html" target="_blank" class="game-card">
                <div class="game-cover">
                    <img src="../images/y1.png" alt="维京战争">
                </div>
                <div class="game-info">
                    <h3 class="game-name">维京战争</h3>
                    <p class="game-desc">超好玩的卡片战争游戏（小星汉化）</p>
                </div>
            </a>
            <a href="../yxmb/7/index.html" target="_blank" class="game-card">
                <div class="game-cover">
                    <img src="../images/y7.png" alt="蜘蛛纸牌">
                </div>
                <div class="game-info">
                    <h3 class="game-name">蜘蛛纸牌</h3>
                    <p class="game-desc">游戏的目标以最少的移动次数将牌面中的十叠牌及待发的五组</p>
                </div>
            </a>
            <a href="../yxmb/29/index.html" target="_blank" class="game-card">
                <div class="game-cover">
                    <img src="../images/y29.png" alt="双人五子棋">
                </div>
                <div class="game-info">
                    <h3 class="game-name">双人五子棋</h3>
                    <p class="game-desc">自适应分辨率，可随意调整棋盘大小，可设定棋盘规格（双人游戏）</p>
                </div>
            </a>
            <a href="../yxmb/38/index.html" target="_blank" class="game-card">
                <div class="game-cover">
                    <img src="../images/y38.png" alt="双人五子棋2.0">
                </div>
                <div class="game-info">
                    <h3 class="game-name">双人五子棋2.0</h3>
                    <p class="game-desc">自适应分辨率，原生js和canvas实现五子棋小游戏（双人游戏）</p>
                </div>
            </a>
            <a href="../yxmb/65/index.html" target="_blank" class="game-card">
                <div class="game-cover">
                    <img src="../images/y65.png" alt="中国象棋">
                </div>
                <div class="game-info">
                    <h3 class="game-name">中国象棋</h3>
                    <p class="game-desc">HTML5+JS编写，效果很逼真，一点也不会出现卡的情况效果相当不错（小星美化）</p>
                </div>
            </a>
            <a href="../yxmb/73/index.html" target="_blank" class="game-card">
                <div class="game-cover">
                    <img src="../images/y73.png" alt="16宫格翻牌匹配">
                </div>
                <div class="game-info">
                    <h3 class="game-name">16宫格翻牌匹配</h3>
                    <p class="game-desc">一款16宫格的翻牌图标匹配游戏，翻开两个图标一样，进行匹配小游戏</p>
                </div>
            </a>
        </div>
        <!-- 搜索无结果提示，与全站功能统一 -->
        <div class="empty-tip" id="emptyTip">
            <i class="fa fa-search"></i>
            没有找到相关游戏，换个关键词试试吧
        </div>
    </div>

    <!-- 保留搜索联动js，与父页面搜索框无缝对接 -->
    <script>
        window.addEventListener("message", function(e){
            if(e.data.type === "search"){
                const keyword = e.data.keyword.toLowerCase().trim();
                const gameCards = document.querySelectorAll(".game-card");
                let hasResult = false;

                gameCards.forEach(card => {
                    const gameName = card.querySelector(".game-name").textContent.toLowerCase();
                    const gameDesc = card.querySelector(".game-desc").textContent.toLowerCase();
                    if(gameName.includes(keyword) || gameDesc.includes(keyword)){
                        card.classList.remove("hidden");
                        hasResult = true;
                    }else{
                        card.classList.add("hidden");
                    }
                });

                const emptyTip = document.getElementById("emptyTip");
                if(hasResult || keyword === ""){
                    emptyTip.classList.remove("show");
                }else{
                    emptyTip.classList.add("show");
                }
            }
        });
    </script>
</body>
</html>
